[project]
name = "finance-tracker"
version = "0.1.0"
description = "WhatsApp-based personal finance tracker"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.112.0",
    "psycopg2-binary>=2.9.0",
    "twilio>=9.10.4",
    "requests>=2.32.0",
    "boto3>=1.37.0",
    "openpyxl>=3.1.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ipykernel>=7.2.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.2",
]
evals = [
    "arize-phoenix>=8.0.0",
    "openinference-instrumentation-openai>=0.1.0",
    "openinference-instrumentation-anthropic>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.black]
target-version = ["py312"]
